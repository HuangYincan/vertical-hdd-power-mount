<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
  <rect width="1000" height="720" fill="#fff"/>
  <style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#111} .dim{stroke:#135;stroke-width:2;fill:none} .body{stroke:#222;stroke-width:3;fill:#e8f5df} .note{font-size:20px} .label{font-size:24px;font-weight:700} .small{font-size:18px}</style>
  <text x="40" y="48" class="label">3.5-inch drive envelope — SFF-8301 reference</text>
  <text x="40" y="78" class="small">Schematic dimensional reference; verify the exact drive drawing before fabrication.</text>
  <rect x="120" y="170" width="520" height="360" rx="8" class="body"/>
  <circle cx="175" cy="225" r="8" fill="#135"/><circle cx="585" cy="225" r="8" fill="#135"/>
  <circle cx="175" cy="475" r="8" fill="#135"/><circle cx="585" cy="475" r="8" fill="#135"/>
  <line x1="120" y1="145" x2="640" y2="145" class="dim"/><line x1="120" y1="152" x2="120" y2="138" class="dim"/><line x1="640" y1="152" x2="640" y2="138" class="dim"/>
  <text x="335" y="132" class="note">146.0–147.0 mm</text>
  <line x1="85" y1="170" x2="85" y2="530" class="dim"/><line x1="78" y1="170" x2="92" y2="170" class="dim"/><line x1="78" y1="530" x2="92" y2="530" class="dim"/>
  <text x="58" y="390" class="note" transform="rotate(-90 58 390)">101.60 mm</text>
  <text x="145" y="567" class="small">Top view / mounting-hole locations are schematic.</text>
  <rect x="735" y="235" width="150" height="60" class="body"/>
  <text x="735" y="330" class="note">height options</text>
  <text x="755" y="365" class="note">17.8 mm</text><text x="755" y="400" class="note">26.1 mm typical</text><text x="755" y="435" class="note">42.0 mm max class</text>
  <text x="40" y="660" class="note">SFF-8301 includes multiple height classes; common desktop drives are around 26.1 mm high.</text>
</svg>
