<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
  <rect width="1000" height="720" fill="#fff"/>
  <style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#111} .dim{stroke:#135;stroke-width:2;fill:none} .body{stroke:#222;stroke-width:3;fill:#dceeff} .thin{stroke:#567;stroke-width:1.5;fill:none} .note{font-size:20px} .label{font-size:24px;font-weight:700} .small{font-size:18px}</style>
  <text x="40" y="48" class="label">2.5-inch drive envelope — SFF-8201 reference</text>
  <text x="40" y="78" class="small">Schematic dimensional reference; verify the exact drive drawing before fabrication.</text>
  <rect x="140" y="170" width="500" height="349" rx="8" class="body"/>
  <circle cx="190" cy="220" r="7" fill="#135"/><circle cx="590" cy="220" r="7" fill="#135"/>
  <circle cx="190" cy="469" r="7" fill="#135"/><circle cx="590" cy="469" r="7" fill="#135"/>
  <line x1="140" y1="145" x2="640" y2="145" class="dim"/><line x1="140" y1="152" x2="140" y2="138" class="dim"/><line x1="640" y1="152" x2="640" y2="138" class="dim"/>
  <text x="330" y="132" class="note">100.0–100.45 mm</text>
  <line x1="105" y1="170" x2="105" y2="519" class="dim"/><line x1="98" y1="170" x2="112" y2="170" class="dim"/><line x1="98" y1="519" x2="112" y2="519" class="dim"/>
  <text x="78" y="370" class="note" transform="rotate(-90 78 370)">69.85–70.10 mm</text>
  <text x="160" y="555" class="small">Top view / mounting-hole locations are schematic.</text>
  <rect x="735" y="245" width="170" height="35" class="body"/><line x1="735" y1="220" x2="905" y2="220" class="dim"/><text x="755" y="212" class="small">thickness</text>
  <text x="760" y="315" class="note">7.0 mm</text><text x="760" y="350" class="note">9.5 mm</text><text x="760" y="385" class="note">12.5 mm</text><text x="760" y="420" class="note">15.0 mm</text>
  <text x="40" y="660" class="note">SFF-8201 defines a family of thickness options; this drawing shows the common envelope values.</text>
</svg>
